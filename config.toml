# ============================================================
#  文献雷达配置（改这里就能调整追踪方向，不用动代码）
#  正则写在单引号里；不区分大小写；匹配范围 = 标题 + 摘要
# ============================================================

[settings]
site_title = "文献雷达 · 合成氨 / 焦耳热 / ALD"
# 部署好 GitHub Pages 后，把网址填在这里，微信推送里会带上“查看全部”链接
site_url = "https://guizehua88-max.github.io/paper-radar/"
first_run_lookback_days = 30   # 第一次运行回溯多少天
lookback_days = 5              # 之后每次回看几天（有重叠，靠去重保证不重复推送）
min_push_score = 18            # 达到多少分推送到微信：交叉40 / 直接25 / 可迁移15 / 待核9 / 背景6；关键词在标题里 +3、顶刊 +4、关注作者 +8
max_push_items = 25            # 单条推送最多列几篇，其余去网页看
heartbeat_days = 7             # 连续多少天没有新增时，发一条“运行正常”的心跳消息
archive_from = "2024-01"       # 资料库从哪个月开始（更早发表的不收）
backfill_rows = 200            # 回填时每个检索词每月取多少条候选
old_cloud_url = "https://paperresearch.de5.net"   # 旧云端站：首次部署时自动导入一次（导入后可删掉这行）

# 给可选的 AI 复核用的研究背景（不配置 LLM 就不会用到）
research_profile = """
我是研究生，课题是“焦耳热（快速电加热/脉冲程序升温）驱动的热催化合成氨，并用原子层沉积（ALD）精准构筑和调控催化剂”。
最关心：焦耳热/电加热/非平衡加热用于合成氨或催化剂制备；ALD 构筑的催化剂（尤其合成氨相关的 Ru、Fe、Co、Ni 等）；热催化合成氨的新催化剂与新机理。
次要：电催化/光催化合成氨、氨分解、焦耳热制备其他催化剂。
不关心：流体力学/电子器件里的焦耳热、氨燃烧与发动机、半导体器件里的 ALD、电池涂层 ALD。
"""

# 顶刊加分（期刊全名，大小写和 & / and 不敏感）
top_journals = [
  "Nature", "Science", "Science Advances", "Nature Catalysis", "Nature Energy", "Nature Chemistry",
  "Nature Synthesis", "Nature Materials", "Nature Nanotechnology", "Nature Communications",
  "Nature Chemical Engineering", "Joule", "Chem", "Journal of the American Chemical Society", "JACS",
  "Angewandte Chemie International Edition", "Angewandte Chemie", "Energy & Environmental Science",
  "Advanced Materials", "Advanced Energy Materials", "ACS Catalysis", "National Science Review",
  "Chemical Reviews", "Chemical Society Reviews", "Accounts of Chemical Research",
]

# 关注的课题组 / 作者（论文命中任一方向且作者匹配时会标“关注作者”并加分）
# 同名作者很常见，所以只给已经命中方向的论文加标签，不会单凭名字收录
[watch]
authors = [
  "Junling Lu",       # 路军岭 USTC，ALD 催化
  "Ping Chen",        # 陈萍 大连化物所，合成氨
  "Tian-Nan Ye",      # 叶天南 上海交大，合成氨
  "Lilong Jiang",     # 江莉龙 福州大学，合成氨
  "Liangbing Hu",     # 胡良兵 Yale，高温热冲击/焦耳热
  "James M. Tour",    # Rice，闪蒸焦耳热
  "Hideo Hosono",     # 东工大，电子化合物合成氨
]

